version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/ccany.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: ccany
build:
  run_buildscript: false
images:
  # 主应用：上游有完整三段 SemVer tag（1.0.3~1.1.2），排除 -amd64/-arm64 平台后缀
  - id: ccany
    target: service
    service: ccany
    source: czyt/ccany
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: CCAny
    summary: "Proxy Claude Code to Any Open API"
